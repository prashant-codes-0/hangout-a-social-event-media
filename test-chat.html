<!DOCTYPE html>
<html>

<head>
    <title>Hangout Chat Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <h1>Hangout Chat Test</h1>

    <div>
        <label>JWT Token:</label>
        <input type="text" id="token" placeholder="Paste your JWT token here" style="width: 400px;">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div>
        <label>Hangout ID:</label>
        <input type="text" id="hangoutId" placeholder="Enter hangout ID">
        <button onclick="joinHangout()">Join Hangout</button>
        <button onclick="leaveHangout()">Leave Hangout</button>
    </div>

    <div>
        <label>Message:</label>
        <input type="text" id="messageInput" placeholder="Type your message">
        <button onclick="sendMessage()">Send Message</button>
    </div>
    
    <div>
        <h3>Load Messages:</h3>
        <button onclick="loadAllMessages()">Load All Messages</button>
        <button onclick="loadRecentMessages()">Load Recent Messages (24h)</button>
        <button onclick="loadRestrictedHistory()">Load Restricted History</button>
        <button onclick="loadCustomRecentMessages()">Load Last 6 Hours</button>
        <button onclick="clearMessages()">Clear Messages</button>
    </div>

    <div>
        <h3>Messages:</h3>
        <div id="messages" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px;"></div>
    </div>

    <div>
        <h3>Events:</h3>
        <div id="events"
            style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; background: #f5f5f5;">
        </div>
    </div>

    <script>
        let socket = null;

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Please enter JWT token');
                return;
            }

            socket = io('http://localhost:3000/chat', {
                auth: { token: token }
            });

            socket.on('connect', () => {
                addEvent('Connected to chat server');
            });

            socket.on('disconnect', () => {
                addEvent('Disconnected from chat server');
            });

            socket.on('joinedHangout', (data) => {
                addEvent(`✅ Successfully joined hangout: ${data.hangoutId}`, 'success');
            });

            socket.on('leftHangout', (data) => {
                addEvent(`❌ Left hangout: ${data.hangoutId}`, 'info');
            });

            socket.on('newMessage', (message) => {
                addEvent(`📨 Received message from ${message.userId.name}: "${message.content}"`, 'success');
                addMessage(message);
            });

            socket.on('messageSent', (message) => {
                addEvent(`✅ Your message was sent successfully: "${message.content}"`, 'success');
                addMessage(message);
            });

            socket.on('messageEdited', (message) => {
                addEvent(`Message edited: ${message.content}`);
            });

            socket.on('messageEditConfirmed', (message) => {
                addEvent('Your message edit was confirmed');
            });

            socket.on('messageDeleted', (data) => {
                addEvent(`Message deleted: ${data.messageId}`);
            });

            socket.on('userJoined', (data) => {
                addEvent(`User joined: ${data.message}`);
            });

            socket.on('userLeft', (data) => {
                addEvent(`User left: ${data.message}`);
            });

            socket.on('userTyping', (data) => {
                addEvent(`${data.user.email} is ${data.isTyping ? 'typing...' : 'stopped typing'}`);
            });

            socket.on('error', (error) => {
                addEvent(`Error: ${error.message}`, 'error');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        function joinHangout() {
            const hangoutId = document.getElementById('hangoutId').value;
            if (!hangoutId || !socket) {
                alert('Please enter hangout ID and connect first');
                return;
            }

            socket.emit('joinHangout', { hangoutId });
        }

        function leaveHangout() {
            const hangoutId = document.getElementById('hangoutId').value;
            if (!hangoutId || !socket) {
                alert('Please enter hangout ID and connect first');
                return;
            }

            socket.emit('leaveHangout', { hangoutId });
        }

        function sendMessage() {
            const hangoutId = document.getElementById('hangoutId').value;
            const content = document.getElementById('messageInput').value;

            if (!hangoutId || !content || !socket) {
                alert('Please fill all fields and connect first');
                return;
            }

            addEvent(`📤 Sending message: "${content}" to hangout ${hangoutId}`, 'info');

            socket.emit('sendMessage', {
                hangoutId,
                content,
                messageType: 'text'
            });

            document.getElementById('messageInput').value = '';
        }

        function addMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `
                <strong>${message.userId.name}:</strong> ${message.content}
                <small style="color: #666;">(${new Date(message.createdAt).toLocaleTimeString()})</small>
            `;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addEvent(message, type = 'info') {
            const eventsDiv = document.getElementById('events');
            const eventElement = document.createElement('div');
            let color = 'blue';
            if (type === 'error') color = 'red';
            if (type === 'success') color = 'green';
            if (type === 'warning') color = 'orange';

            eventElement.style.color = color;
            eventElement.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            eventsDiv.appendChild(eventElement);
            eventsDiv.scrollTop = eventsDiv.scrollHeight;
        }
        
        // Message loading functions
        async function loadAllMessages() {
            const hangoutId = document.getElementById('hangoutId').value;
            const token = document.getElementById('token').value;
            
            if (!hangoutId || !token) {
                alert('Please enter hangout ID and token first');
                return;
            }
            
            try {
                addEvent('📥 Loading all messages...', 'info');
                const response = await fetch(`http://localhost:3000/chat/hangout/${hangoutId}/messages?limit=20`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    displayLoadedMessages(result.data, 'All Messages');
                } else {
                    addEvent(`❌ Error loading messages: ${result.message}`, 'error');
                }
            } catch (error) {
                addEvent(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function loadRecentMessages() {
            const hangoutId = document.getElementById('hangoutId').value;
            const token = document.getElementById('token').value;
            
            if (!hangoutId || !token) {
                alert('Please enter hangout ID and token first');
                return;
            }
            
            try {
                addEvent('📥 Loading recent messages (24h)...', 'info');
                const response = await fetch(`http://localhost:3000/chat/hangout/${hangoutId}/recent-messages?hours=24`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    displayLoadedMessages(result.data, 'Recent Messages (24h)');
                } else {
                    addEvent(`❌ Error loading recent messages: ${result.message}`, 'error');
                }
            } catch (error) {
                addEvent(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function loadRestrictedHistory() {
            const hangoutId = document.getElementById('hangoutId').value;
            const token = document.getElementById('token').value;
            
            if (!hangoutId || !token) {
                alert('Please enter hangout ID and token first');
                return;
            }
            
            try {
                addEvent('📥 Loading restricted history...', 'info');
                const response = await fetch(`http://localhost:3000/chat/hangout/${hangoutId}/messages?restrictHistory=true&limit=20`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    displayLoadedMessages(result.data, 'Restricted History');
                } else {
                    addEvent(`❌ Error loading restricted history: ${result.message}`, 'error');
                }
            } catch (error) {
                addEvent(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function loadCustomRecentMessages() {
            const hangoutId = document.getElementById('hangoutId').value;
            const token = document.getElementById('token').value;
            
            if (!hangoutId || !token) {
                alert('Please enter hangout ID and token first');
                return;
            }
            
            try {
                addEvent('📥 Loading last 6 hours messages...', 'info');
                const response = await fetch(`http://localhost:3000/chat/hangout/${hangoutId}/recent-messages?hours=6`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    displayLoadedMessages(result.data, 'Last 6 Hours');
                } else {
                    addEvent(`❌ Error loading 6h messages: ${result.message}`, 'error');
                }
            } catch (error) {
                addEvent(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function displayLoadedMessages(messages, title) {
            const messagesDiv = document.getElementById('messages');
            
            // Add title separator
            const titleElement = document.createElement('div');
            titleElement.innerHTML = `<hr><strong>📋 ${title} (${messages.length} messages):</strong><hr>`;
            titleElement.style.backgroundColor = '#f0f0f0';
            titleElement.style.padding = '5px';
            titleElement.style.margin = '5px 0';
            messagesDiv.appendChild(titleElement);
            
            // Add messages (reverse order since API returns newest first)
            messages.reverse().forEach(message => {
                addMessage(message);
            });
            
            addEvent(`✅ Loaded ${messages.length} messages for ${title}`, 'success');
        }
        
        function clearMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            addEvent('🗑️ Messages cleared', 'info');
        }
    </script>
</body>

</html>
